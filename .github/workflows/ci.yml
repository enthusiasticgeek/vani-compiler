name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── x86-64: full test suite including integration tests ──────────────────
  test-x86:
    name: Test (x86-64 Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM tools and SMT solver
        run: |
          sudo apt-get update -q
          sudo apt-get install -q -y llvm clang z3

      - name: Run full test suite
        run: cargo test

  # ── AArch64: lib unit tests via QEMU user-mode ───────────────────────────
  #
  # Runs the 2000+ compiler unit tests (src/lib.rs) on an emulated AArch64
  # CPU. Verifies that the IR emitter, type checker, SSA lowerer, and
  # backend produce identical output when the compiler itself runs on ARM64.
  #
  # Integration tests (tests/*.rs) are excluded because they spawn the vanic
  # binary which in turn invokes cc/llc — those are x86-64 host binaries and
  # cannot run under AArch64 QEMU. Correctness of the generated code on real
  # AArch64 hardware is tracked in ARM-3 (needs Graviton / Pi 4 / M-series).
  test-aarch64-qemu:
    name: Test (AArch64 via QEMU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (AArch64 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install AArch64 cross-toolchain + QEMU user-mode
        run: |
          sudo apt-get update -q
          sudo apt-get install -q -y gcc-aarch64-linux-gnu qemu-user-static z3

      - name: Run lib unit tests on AArch64 (via QEMU)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64-static -L /usr/aarch64-linux-gnu
        run: cargo test --lib --target aarch64-unknown-linux-gnu

  # ── RISC-V 64: lib unit tests via QEMU user-mode ─────────────────────────
  #
  # Equivalent of test-aarch64-qemu for RISC-V 64-bit Linux (SIMD-6).
  # Verifies the compiler itself runs correctly on an emulated RV64GC core.
  # The Vector (RVV) extension is NOT enabled here — these are compiler unit
  # tests, not RVV codegen tests. RVV functional testing is done via
  # `vanic run --target=riscv64-unknown-linux-gnu --cpu=sifive-x280` +
  # QEMU_RISCV64="qemu-riscv64-static -cpu rv64,v=true,vlen=256".
  # Real RVV performance numbers require real silicon (tracked: RVV-bench).
  test-riscv64-qemu:
    name: Test (RISC-V 64 via QEMU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (RISC-V 64 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64gc-unknown-linux-gnu

      - name: Install RISC-V cross-toolchain + QEMU user-mode
        run: |
          sudo apt-get update -q
          sudo apt-get install -q -y gcc-riscv64-linux-gnu qemu-user-static z3

      - name: Run lib unit tests on RISC-V 64 (via QEMU)
        env:
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_RUNNER: qemu-riscv64-static -L /usr/riscv64-linux-gnu
        run: cargo test --lib --target riscv64gc-unknown-linux-gnu

  # ── Memory-safety sweep: ASan + LeakSanitizer + UBSan over the example corpus
  #
  # Added after round 8's bug-pattern audit (2026-08-09), which found this
  # kind of systematic sweep had never been run before and turned up two
  # real bugs on its first pass (BUG-153/154, one of them a genuine
  # heap-use-after-free) plus a third the same day (BUG-157). Every example
  # under examples/ that passes `vanic check` is compiled to C with
  # `-fsanitize=address,leak,undefined` (matching `vanic run --backend=c`'s
  # own real compile flags) and run; a NEW finding not already tracked in
  # tools/leak_sweep_baseline.json fails the job. See
  # docs/BUG_PATTERN_AUDIT_TODO_8.md for the full methodology writeup and
  # why each currently-baselined finding is there.
  leak-sweep:
    name: Memory-safety sweep (ASan/LSan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build vanic (release)
        run: cargo build --release --bin vanic

      - name: Run leak sweep against the checked-in baseline
        run: python3 tools/leak_sweep.py

  # ── Backend cross-check: LLVM vs. C exit-code differential over the corpus
  #
  # Added for #191 (2026-08-14, "improve internal compiler-testing
  # tooling"). Every example under examples/ that passes `vanic check` is
  # run via BOTH `vanic run` (LLVM, the default) and `vanic run
  # --backend=c`, and their exit codes must agree. Targets the exact bug
  # class BUG-192 turned out to be: a silent LLVM-vs-tree-backend
  # divergence found only by a human manually diffing IR. This sweep's
  # very first local run caught a real one on its own (an overflow/
  # divide-by-zero/shift trap that exited 3 on LLVM but 134/SIGABRT on
  # C), fixed the same day -- see docs/TODO_CURRENT.md's #191 entry. A
  # NEW finding not already tracked in
  # tools/backend_crosscheck_baseline.json (if that file exists -- there
  # is currently nothing to baseline) fails the job.
  backend-crosscheck:
    name: Backend cross-check (LLVM vs. C exit codes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM tools and SMT solver
        run: |
          sudo apt-get update -q
          sudo apt-get install -q -y llvm clang z3

      - name: Build vanic (release)
        run: cargo build --release --bin vanic

      - name: Run backend cross-check against the checked-in baseline
        run: python3 tools/backend_crosscheck.py

  # ── Build-system integration example: Make, CMake, Meson, Ninja ─────────
  #
  # tutorials/src/intermediate/09d_build_systems.md documents a mixed
  # C+vāṇी project built four different ways. Before this job existed,
  # every snippet on that page was untested markdown -- confirmed by
  # actually building it directly, the Meson version linked against a
  # static_library() of the raw vāṇī output and failed with "multiple
  # definition of 'main'" (fixed in the same pass that added this job).
  # examples/build_systems/myproject/ is the real, buildable project the
  # tutorial's snippets are now copied from; this job builds it with all
  # four tools and checks each produces the same correct output, so a
  # future change to `vanic emit`'s output shape (or to any of the four
  # build files) gets caught here instead of silently rotting docs again.
  build-systems-example:
    name: Build-system integration example (Make/CMake/Meson/Ninja)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -q -y cmake ninja-build meson binutils

      - name: Build vanic (release)
        run: cargo build --release --bin vanic

      - name: Build and run with Make
        working-directory: examples/build_systems/myproject
        run: |
          export PATH="$GITHUB_WORKSPACE/target/release:$PATH"
          make run | tee /tmp/out-make.txt
          grep -q "square(4) = 16" /tmp/out-make.txt
          grep -q "cube(3) = 27" /tmp/out-make.txt
          make clean

      - name: Build and run with CMake
        working-directory: examples/build_systems/myproject
        run: |
          export PATH="$GITHUB_WORKSPACE/target/release:$PATH"
          cmake -B build-cmake
          cmake --build build-cmake
          ./build-cmake/myproject | tee /tmp/out-cmake.txt
          grep -q "square(4) = 16" /tmp/out-cmake.txt
          grep -q "cube(3) = 27" /tmp/out-cmake.txt
          rm -rf build-cmake

      - name: Build and run with Meson
        working-directory: examples/build_systems/myproject
        run: |
          export PATH="$GITHUB_WORKSPACE/target/release:$PATH"
          meson setup build-meson
          ninja -C build-meson
          ./build-meson/myproject | tee /tmp/out-meson.txt
          grep -q "square(4) = 16" /tmp/out-meson.txt
          grep -q "cube(3) = 27" /tmp/out-meson.txt
          rm -rf build-meson

      - name: Build and run with hand-written Ninja
        working-directory: examples/build_systems/myproject
        run: |
          export PATH="$GITHUB_WORKSPACE/target/release:$PATH"
          ninja
          ./build-ninja/myproject | tee /tmp/out-ninja.txt
          grep -q "square(4) = 16" /tmp/out-ninja.txt
          grep -q "cube(3) = 27" /tmp/out-ninja.txt
          rm -rf build-ninja

  # ── vani_translate.py regression suite ───────────────────────────────────
  #
  # Added 2026-08-12 after confirming this tool's hand-maintained ALIASES
  # table had drifted from src/lexer.rs (the same shape as BUG-173's
  # src/lsp.rs staleness) badly enough that translating several real
  # dialects produced output that didn't compile. Guards against it
  # recurring -- see tools/test_vani_translate.py's own docstring for the
  # full check list.
  translate-tool-check:
    name: vani_translate.py regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build vanic (release)
        run: cargo build --release --bin vanic

      - name: Run translate-tool regression suite
        run: python3 tools/test_vani_translate.py
