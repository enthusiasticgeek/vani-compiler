name: Deploy Tutorials to GitHub Pages

# Triggers:
#   - Automatic: any push to main that changes tutorials/ or this file
#   - Manual:    Actions tab → "Deploy Tutorials to GitHub Pages" → Run workflow
on:
  push:
    branches: [main]
    paths:
      - "tutorials/**"
      - ".github/workflows/deploy-tutorials.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; skip runs queued behind an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          MDBOOK_VERSION=0.4.40
          curl -sSL \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /usr/local/bin/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build tutorials
        run: mdbook build tutorials/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: tutorials/book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
