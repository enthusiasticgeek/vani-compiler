name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: vanic
            archive: vanic-linux-x86_64.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: vanic
            archive: vanic-linux-aarch64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: vanic.exe
            archive: vanic-windows-x86_64.zip
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: vanic
            archive: vanic-macos-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: vanic
            archive: vanic-macos-aarch64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compiler (aarch64 Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update -q
          sudo apt-get install -q -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --bin vanic --target ${{ matrix.target }}

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.artifact }} vanic
          tar czf ${{ matrix.archive }} vanic install.sh
          echo "ASSET=${{ matrix.archive }}" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.artifact }}" vanic.exe
          Compress-Archive -Path vanic.exe, install.ps1 -DestinationPath ${{ matrix.archive }}
          echo "ASSET=${{ matrix.archive }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Resolve release notes
        id: notes
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          NOTES_FILE="RELEASE_NOTES/${TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "body_path=$NOTES_FILE" >> "$GITHUB_OUTPUT"
            echo "generate=false"        >> "$GITHUB_OUTPUT"
          else
            echo "body_path="            >> "$GITHUB_OUTPUT"
            echo "generate=true"         >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: vāṇी ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: ${{ steps.notes.outputs.generate }}
          files: |
            dist/vanic-linux-x86_64.tar.gz
            dist/vanic-linux-aarch64.tar.gz
            dist/vanic-windows-x86_64.zip
            dist/vanic-macos-x86_64.tar.gz
            dist/vanic-macos-aarch64.tar.gz

      # Binaries are rebuildable from any git tag, so pruning is safe --
      # only the 3 most recent releases keep their (multi-hundred-MB
      # combined) binary assets attached. The release page itself (tag,
      # title, notes) is untouched for every version; only the large
      # files are removed from older ones, to bound storage growth.
      - name: Prune binary assets from older releases (keep newest 3)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mapfile -t tags < <(gh release list --limit 100 --json tagName --jq '.[].tagName')
          keep=3
          for i in "${!tags[@]}"; do
            if [ "$i" -lt "$keep" ]; then
              continue
            fi
            tag="${tags[$i]}"
            assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
            if [ -z "$assets" ]; then
              continue
            fi
            echo "Pruning assets from $tag (rank $((i+1)), older than the newest $keep):"
            while IFS= read -r asset; do
              echo "  deleting $asset"
              gh release delete-asset "$tag" "$asset" -y
            done <<< "$assets"
          done
