# Read-only filesystem allowlist -- toolchain paths needed to build/run
# vanic but that should never be writable by sandboxed tooling. Same
# format/enforcement as allowed_paths.conf (see sandbox_lib.sh), via
# BindReadOnlyPaths=.
#
# TEMPLATE -- edit for your machine. These are the typical locations for
# a standard rustup install; adjust if yours differs (e.g. a
# distro-packaged Rust toolchain would live under /usr instead, which is
# already readable under ProtectSystem=strict and doesn't need listing
# here at all).
#
# /home/YOUR_USER/.cargo
# /home/YOUR_USER/.rustup
