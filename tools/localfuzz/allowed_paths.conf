# Read-write filesystem allowlist for any local-model-adjacent tooling on
# this machine (the harness, and run-sandboxed.sh for manual tools like
# Aider). One absolute path per line. Blank lines and lines starting with
# # are ignored. Enforced via systemd BindPaths= on top of
# ProtectHome=tmpfs (see sandbox_lib.sh) -- anything NOT listed here (or
# in allowed_readonly_paths.conf) is invisible to sandboxed processes,
# not just unwritable.
#
# TEMPLATE -- this file ships with everything commented out on purpose.
# Sandboxed processes get access to NOTHING under /home until you edit
# this. Uncomment and fix the paths below for your machine (see
# README.md "Replicating on another PC", step 0, for creating the
# dedicated worktree these paths should point at).
#
# The main checkout's .git dir is required, NOT a scope violation: git
# worktrees share object storage and per-worktree refs with the main
# checkout's .git directory by design. This does NOT expose or allow
# writes to the main checkout's working-tree files (src/, docs/, etc.) --
# only the shared git plumbing under .git/.
#
# /home/YOUR_USER/path/to/vani-compiler-localfuzz
# /home/YOUR_USER/path/to/vani-compiler/.git

# Add more project paths below as needed, e.g.:
# /home/YOUR_USER/path/to/some-other-project
