# Local, capped, isolated fuzz/report pipeline for vani-compiler.
#
# Isolation guarantees this file is responsible for:
#  - Resource: both services get a HARD ceiling via `cpus`/`mem_limit`
#    (+ `memswap_limit` pinned equal to `mem_limit` so a container can
#    never spill into swap and thrash the whole host). This is the real
#    guarantee -- it caps absolute consumption regardless of what else is
#    running. `cpu_shares` is left in as a secondary, weaker aid: it only
#    affects relative priority among cgroups that are actual siblings in
#    the host's cgroup tree, which a container vs. a plain host process
#    often isn't -- don't rely on it alone for headroom, rely on the caps.
#  - Filesystem/build: the repo bind-mounted here is the DEDICATED
#    `vani-compiler-localfuzz` worktree (branch local-fuzz-findings), never
#    the main checkout. Build output lands in that worktree's own target/,
#    never the host's main checkout's target/.
#  - Git identity: set via GIT_AUTHOR_*/GIT_COMMITTER_* env vars, NOT via
#    `git config --local` -- in a linked worktree, `--local` writes to the
#    config shared with every other worktree of this repo (including your
#    main checkout), which would have silently changed commit identity
#    there too. Env vars avoid touching any git config file at all.
#
# Note: `cpus`/`mem_limit`/`memswap_limit` (not `deploy.resources.limits`)
# are used deliberately -- `deploy.resources.limits` is a Swarm-mode key
# and is SILENTLY IGNORED by plain `docker compose up` unless you pass
# `--compatibility`. The top-level keys below are honored directly.

services:
  ollama:
    image: ollama/ollama:latest
    container_name: vani-localfuzz-ollama
    restart: unless-stopped
    cpus: 1.5
    mem_limit: 3g
    memswap_limit: 3g
    cpu_shares: 256
    volumes:
      - ollama-models:/root/.ollama
    networks: [localfuzz]

  vani-fuzz:
    build:
      context: .
      dockerfile: Dockerfile.harness
    container_name: vani-localfuzz-harness
    restart: unless-stopped
    depends_on: [ollama]
    cpus: 1
    mem_limit: 1g
    memswap_limit: 1g
    cpu_shares: 256
    environment:
      OLLAMA_URL: "http://ollama:11434"
      OLLAMA_MODEL: "qwen2.5-coder:7b-instruct-q4_K_M"
      HARNESS_SLEEP: "20"
      HARNESS_AUTOCOMMIT: "1"
      HARNESS_GENERATE_EVERY: "5"
      GIT_AUTHOR_NAME: "vani-localfuzz-bot"
      GIT_AUTHOR_EMAIL: "localfuzz@vani.local"
      GIT_COMMITTER_NAME: "vani-localfuzz-bot"
      GIT_COMMITTER_EMAIL: "localfuzz@vani.local"
    volumes:
      - ../../:/repo
      - cargo-registry:/usr/local/cargo/registry
    networks: [localfuzz]

volumes:
  ollama-models:
  cargo-registry:

networks:
  localfuzz:
